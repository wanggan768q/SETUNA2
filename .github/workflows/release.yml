name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动执行原因'
        required: false
        default: '测试构建'
  schedule:
    # 每周一上午 9:00 UTC 自动执行一次 (北京时间周一17:00)
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore SETUNA/SETUNA.csproj
      
    - name: Restore test dependencies
      run: dotnet restore SETUNATests/SETUNATests.csproj || echo "Test project not available"
      
    - name: Build
      run: dotnet build SETUNA/SETUNA.csproj --configuration Release --no-restore
      
    - name: Build test project
      run: dotnet build SETUNATests/SETUNATests.csproj --configuration Release --no-restore || echo "Test project build failed, continuing..."
      
    - name: Publish single-file (Framework dependent)
      run: dotnet publish SETUNA/SETUNA.csproj --configuration Release --output ./publish-framework --self-contained false --runtime win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      
    - name: Publish single-file (Self-contained)
      run: dotnet publish SETUNA/SETUNA.csproj --configuration Release --output ./publish-self-contained --self-contained true --runtime win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
      
    - name: Get version info
      id: version
      run: |
        if ("${{ github.ref }}" -like "refs/tags/*") {
          $version = "${{ github.ref }}" -replace "refs/tags/", ""
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "isRelease=true" >> $env:GITHUB_OUTPUT
        } else {
          $date = Get-Date -Format "yyyyMMdd-HHmm"
          $version = "nightly-$date"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "isRelease=false" >> $env:GITHUB_OUTPUT
        }
        
    - name: Create ZIP packages
      run: |
        # 框架依赖版本（推荐，体积小）
        $publishPathFramework = "publish-framework"
        $zipNameFramework = "SETUNA-${{ steps.version.outputs.version }}-framework-win-x64.zip"
        
        if (Test-Path "$publishPathFramework/SETUNA.exe") {
          Write-Host "Found framework version SETUNA.exe, creating release package..."
          Compress-Archive -Path "$publishPathFramework/*" -DestinationPath $zipNameFramework -Force
          Write-Host "Framework ZIP package created: $zipNameFramework"
        } else {
          Write-Host "Framework SETUNA.exe not found in publish directory"
          Get-ChildItem $publishPathFramework | Write-Host
          exit 1
        }
        
        # 自包含版本（体积大，无需安装.NET）
        $publishPathSelfContained = "publish-self-contained"
        $zipNameSelfContained = "SETUNA-${{ steps.version.outputs.version }}-selfcontained-win-x64.zip"
        
        if (Test-Path "$publishPathSelfContained/SETUNA.exe") {
          Write-Host "Found self-contained version SETUNA.exe, creating release package..."
          Compress-Archive -Path "$publishPathSelfContained/*" -DestinationPath $zipNameSelfContained -Force
          Write-Host "Self-contained ZIP package created: $zipNameSelfContained"
        } else {
          Write-Host "Self-contained SETUNA.exe not found in publish directory"
          Get-ChildItem $publishPathSelfContained | Write-Host
          exit 1
        }
      
    - name: Create Release
      if: steps.version.outputs.isRelease == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: SETUNA ${{ steps.version.outputs.version }}
        body: |
          ## 🚀 SETUNA ${{ steps.version.outputs.version }} 发布
          
          ### 📦 下载
          - `SETUNA-${{ steps.version.outputs.version }}-framework-win-x64.zip`: 框架依赖版本（推荐，约5-10MB）
          - `SETUNA-${{ steps.version.outputs.version }}-selfcontained-win-x64.zip`: 自包含版本（约70MB，无需安装.NET）
          
          ### ⚙️ 安装说明
          
          **框架依赖版本（推荐）：**
          1. 下载并安装 [.NET 9.0 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0)
          2. 下载 `SETUNA-*-framework-win-x64.zip`
          3. 解压缩到任意目录
          4. 运行 `SETUNA.exe` 即可使用
          
          **自包含版本：**
          1. 下载 `SETUNA-*-selfcontained-win-x64.zip`
          2. 解压缩到任意目录
          3. 运行 `SETUNA.exe` 即可使用（无需安装.NET运行时）
          
          ### 🔧 系统要求
          - Windows 10 14393 及以上
          - .NET 9.0 Desktop Runtime（框架依赖版本需要）
          - 自包含版本无需额外安装运行时
          
          ### ✨ 主要特性
          - 支持高分屏截图
          - 系统托盘支持
          - 快捷键操作
          - 多显示器支持
          
          ---
          📌 详细说明请查看 [README.md](https://github.com/tylearymf/SETUNA2/blob/main/README.md)
        files: |
          SETUNA-${{ steps.version.outputs.version }}-framework-win-x64.zip
          SETUNA-${{ steps.version.outputs.version }}-selfcontained-win-x64.zip
        draft: false
        prerelease: false
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SETUNA-${{ steps.version.outputs.version }}-packages
        path: |
          SETUNA-${{ steps.version.outputs.version }}-framework-win-x64.zip
          SETUNA-${{ steps.version.outputs.version }}-selfcontained-win-x64.zip
        retention-days: 30